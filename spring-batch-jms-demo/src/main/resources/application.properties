# H2 DB config to be shared among instances. AUTO_SERVER=TRUE allows multiple JVMs.
spring.datasource.url=jdbc:h2:file:./data/batchdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.batch.jdbc.initialize-schema=always
# Use reasonable size so multiple JVMs can connect
spring.datasource.hikari.maximum-pool-size=20

# ActiveMQ config - Use TCP to allow remote communication between nodes.
# One of the nodes (or a standalone broker) should expose this port.
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.activemq.packages.trust-all=true
spring.activemq.pool.enabled=false
spring.jms.listener.auto-startup=true

# Batch
spring.main.allow-bean-definition-overriding=true
spring.batch.job.enabled=false

# Logs
logging.level.org.springframework.batch=INFO
logging.level.org.springframework.integration=INFO
